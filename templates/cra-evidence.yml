# cra-evidence — GitLab CI/CD component (SPEC.md §5).
# Emits a signed, dated evidence bundle (SBOM + vulnerability scan + KEV gate
# result) for every release. See components/cra-evidence/README.md for usage.
#
# Consumable two ways:
#   local   included from this repo (or a fork): scripts come from the checkout.
#   remote  included from another project / the CI/CD Catalog: the jobs clone
#           this repo at `toolkit_ref` (pin a tag!) and use its scripts —
#           the consumer repo needs nothing vendored.

spec:
  inputs:
    stage:
      default: test
      description: Pipeline stage for all cra jobs.
    image_ref:
      description: Container image to generate evidence for (required).
    product_name:
      description: Product name recorded in the manifest (required).
    product_version:
      default: ''
      description: Defaults to CI_COMMIT_TAG, falling back to CI_COMMIT_SHORT_SHA.
    fail_on_kev:
      type: boolean
      default: true
      description: Fail cra:scan-gate when a CISA-KEV-listed CVE is found.
    sign:
      type: boolean
      default: true
      description: Sign SBOM + manifest with cosign keyless (GitLab OIDC).
    evidence_upload_url:
      default: ''
      description: Optional gs:// or s3:// prefix; empty = artifacts only.
    evidence_api_url:
      default: ''
      description: >-
        Optional Compliance OS ingest endpoint (https://<platform>/api/ingest).
        When set (and the masked CI variable CRA_INGEST_TOKEN exists), cra:push
        POSTs the bundle as the final step — no manual upload.
    support_period_end:
      default: ''
      description: Optional declared support period end, recorded into the manifest.
    toolkit_ref:
      default: 'main'
      description: >-
        Git ref of the cra-evidence repo to fetch scripts from when consumed
        remotely (ignored for local includes). Pin a release tag.
---
# Hidden base: pinned image + explicit (never silent) pinned tool install.
# `make tools` reads the versions from the Makefile — the single pin location.
# Script resolution: local checkout when present, else a pinned clone of this
# repo (remote/catalog consumption).
.cra:base:
  stage: $[[ inputs.stage ]]
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq make git python3 tar
    - |
      if [ -d components/cra-evidence/scripts ]; then
        export CRA_SCRIPTS=components/cra-evidence/scripts
        make tools
      else
        git clone --depth 1 --branch "$[[ inputs.toolkit_ref ]]" \
          https://gitlab.com/nextgensolutionsltd/cra-evidence.git .cra-toolkit
        export CRA_SCRIPTS=.cra-toolkit/components/cra-evidence/scripts
        make -C .cra-toolkit tools
      fi
  artifacts:
    when: always # evidence of failure is still evidence
    paths:
      - dist/
    expire_in: 1 year

"cra:sbom":
  extends: .cra:base
  script:
    # Let syft pull from the project registry with the job token.
    - export SYFT_REGISTRY_AUTH_AUTHORITY="$CI_REGISTRY"
    - export SYFT_REGISTRY_AUTH_USERNAME="$CI_REGISTRY_USER"
    - export SYFT_REGISTRY_AUTH_PASSWORD="$CI_JOB_TOKEN"
    - IMAGE_REF="$[[ inputs.image_ref ]]" bash "$CRA_SCRIPTS"/generate_sbom.sh

"cra:scan-gate":
  extends: .cra:base
  needs: ["cra:sbom"]
  script:
    - bash "$CRA_SCRIPTS"/scan_vulns.sh
    - FAIL_ON_KEV="$[[ inputs.fail_on_kev ]]" bash "$CRA_SCRIPTS"/kev_gate.sh

"cra:sign":
  extends: .cra:base
  needs: ["cra:scan-gate"]
  rules:
    - if: '"$[[ inputs.sign ]]" == "true"'
  # GitLab OIDC -> Sigstore keyless signing. Syntax verified against
  # docs.gitlab.com/ci/yaml/signing_examples/ on 2026-07-12.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - FILES="dist/sbom.cdx.json" SIG_DIR="dist/signatures" bash "$CRA_SCRIPTS"/sign_artifacts.sh

"cra:bundle":
  extends: .cra:base
  needs:
    - job: "cra:scan-gate"
    - job: "cra:sign"
      optional: true # absent when sign=false
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - export PRODUCT_NAME="$[[ inputs.product_name ]]"
    - export PRODUCT_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - '[ -n "$[[ inputs.product_version ]]" ] && export PRODUCT_VERSION="$[[ inputs.product_version ]]"'
    - export IMAGE_REF="$[[ inputs.image_ref ]]"
    - export SUPPORT_PERIOD_END="$[[ inputs.support_period_end ]]"
    - export SIGN_MANIFEST="$[[ inputs.sign ]]"
    - bash "$CRA_SCRIPTS"/build_bundle.sh
    # Optional off-site copy. Requires the matching CLI in a custom image;
    # with none set, artifacts-only is the supported v0.1 path.
    - |
      UPLOAD_URL="$[[ inputs.evidence_upload_url ]]"
      if [ -n "$UPLOAD_URL" ]; then
        case "$UPLOAD_URL" in
          gs://*) gcloud storage cp dist/evidence-*.tar.gz "$UPLOAD_URL/" ;;
          s3://*) aws s3 cp dist/evidence-*.tar.gz "$UPLOAD_URL/" ;;
          *) echo "ERROR: evidence_upload_url must start with gs:// or s3://" >&2; exit 1 ;;
        esac
      else
        echo "cra:bundle: no evidence_upload_url set — bundle kept as CI artifact only."
      fi

# Final step: push the bundle straight into Compliance OS (no manual upload).
# Runs only when the endpoint input is set; the token comes from the masked CI
# variable CRA_INGEST_TOKEN (created per product in the platform UI).
"cra:push":
  extends: .cra:base
  needs: ["cra:bundle"]
  rules:
    - if: '"$[[ inputs.evidence_api_url ]]" != ""'
  script:
    - |
      if [ -z "${CRA_INGEST_TOKEN:-}" ]; then
        echo "ERROR: evidence_api_url is set but CRA_INGEST_TOKEN is not — add it as a masked CI variable." >&2
        exit 1
      fi
    - INGEST_URL="$[[ inputs.evidence_api_url ]]" INGEST_TOKEN="$CRA_INGEST_TOKEN" EVIDENCE_DIR=dist/evidence bash "$CRA_SCRIPTS"/push_evidence.sh
